services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:?DATABASE_NAME is required}
      MARIADB_USER: ${DATABASE_USER:?DATABASE_USER is required}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

  backend:
    image: ghcr.io/LlamaMan04/inventory-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      # The host reverse proxy can forward API traffic to this port.
      - "127.0.0.1:5001:${SERVER_PORT:-5001}"

  frontend:
    image: ghcr.io/LlamaMan04/inventory-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # The host reverse proxy can forward web traffic to this port.
      - "127.0.0.1:8080:80"

volumes:
  mariadb_data:
